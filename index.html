<!DOCTYPE html>
<html lang="es">
<head>

</head>
<body>

  <!-- Logo estilo Box Logo Supreme -->

  <form action="index_admin.html">
    <label>seleccione su Tipo de Documento:</label>
    <br><br>
    <select name="grupo-campo">

      <option value="C.E">Cedula de Extranjeria</option>
      <option value="T.I">Tarjeta de Identidad</option>
    </select>

    <br><br>
    <label>ingrese su ID:</label>

    <input type="number" name="id_usu" required>

    <br><br>
    <label>Ingrese su Password:</label>
    <br><br>
    <input type="password" name="pas_usu" required>

    <br><br>
    <input class="ing_t1" type="submit" value="Ingresar">
    <br><br>
    <a href="olvide_password.html" class="boton-volver">Olvide mi contraseña</a>
  </form>

</html>
